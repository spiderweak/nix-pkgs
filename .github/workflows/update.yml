name: Update packages

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      # Pin these to full commit SHAs (see README).
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31

      - name: Run update scripts and open one PR per package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"

          for script in pkgs/*/update.sh; do
            pkg=$(basename "$(dirname "$script")")
            git switch --quiet "$BASE"

            old=$(jq -r .version "pkgs/$pkg/sources.json")
            if ! nix develop -c "$script"; then
              echo "::warning::$pkg: update script failed"
              git checkout -- "pkgs/$pkg"
              continue
            fi

            if git diff --quiet -- "pkgs/$pkg"; then
              continue
            fi

            new=$(jq -r .version "pkgs/$pkg/sources.json")
            branch="update/$pkg-$new"

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
              echo "$pkg: PR for $new already open"
              git checkout -- "pkgs/$pkg"
              continue
            fi

            # Build before opening the PR: PRs opened with the workflow token
            # don't trigger the build workflow on their own.
            if ! nix build ".#$pkg" --no-link --print-build-logs; then
              echo "::warning::$pkg $new failed to build, no PR opened"
              git checkout -- "pkgs/$pkg"
              continue
            fi

            git switch --quiet -c "$branch"
            git add "pkgs/$pkg"
            git commit --quiet -m "$pkg: $old -> $new"
            git push --quiet origin "$branch"
            gh pr create \
              --base "$BASE" \
              --head "$branch" \
              --title "$pkg: $old -> $new" \
              --body "Automated update. Built successfully in CI. Only \`pkgs/$pkg/sources.json\` changed."
          done
