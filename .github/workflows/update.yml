name: Update packages

on:
  schedule:
    - cron: "17 5 * * *" # daily
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# A manual run must not race the scheduled one on the same update branches.
concurrency:
  group: update-packages

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      NIX_CONFIG: experimental-features = nix-command flakes
      GH_TOKEN: ${{ github.token }}
      BASE: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2

      - name: Run update scripts and open or refresh one PR per package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"

          for script in pkgs/*/update.sh; do
            pkg=$(basename "$(dirname "$script")")
            # One branch and PR per package: a newer release replaces the
            # pending update instead of stacking PRs that conflict with it.
            branch="update/$pkg"
            git switch --quiet "$BASE"

            old=$(jq -r .version "pkgs/$pkg/sources.json")
            if ! nix develop -c "$script"; then
              echo "::warning::$pkg: update script failed"
              git checkout -- "pkgs/$pkg"
              continue
            fi

            if git diff --quiet -- "pkgs/$pkg"; then
              continue
            fi
            new=$(jq -r .version "pkgs/$pkg/sources.json")

            if git ls-remote --exit-code --heads origin "$branch" >/dev/null \
              && git fetch --quiet --depth=1 origin "$branch" \
              && git diff --quiet FETCH_HEAD -- "pkgs/$pkg"; then
              echo "$pkg: $new already on $branch"
              git checkout -- "pkgs/$pkg"
              continue
            fi

            # Build before pushing: PRs opened with the workflow token
            # don't trigger the build workflow on their own.
            if ! nix build ".#$pkg" --no-link --print-build-logs; then
              echo "::warning::$pkg $new failed to build, no PR opened"
              git checkout -- "pkgs/$pkg"
              continue
            fi

            title="$pkg: $old -> $new"
            git switch --quiet -C "$branch"
            git add "pkgs/$pkg"
            git commit --quiet -m "$title"
            git push --quiet --force origin "$branch"

            pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
            if [ -n "$pr" ]; then
              gh pr edit "$pr" --title "$title"
            else
              gh pr create \
                --base "$BASE" \
                --head "$branch" \
                --title "$title" \
                --body "Automated update. Built successfully in CI. Only \`pkgs/$pkg/sources.json\` changed."
            fi
          done
